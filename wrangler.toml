name = "wsrs-notes"
compatibility_date = "2025-09-01"
pages_build_output_dir = "public"

# D1 binding — the single source of truth.
# Create the database first:
#   wrangler d1 create wsrs-notes
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "wsrs-notes"
database_id = "67625fbc-ec13-4311-9303-5805d58fb51f"                                                                    

# Secrets are NOT set here. Set them with:
#   wrangler pages secret put PASSPHRASE_A
#   wrangler pages secret put PASSPHRASE_B
#   wrangler pages secret put SESSION_SECRET
# For local dev, put them in .dev.vars (git-ignored).
